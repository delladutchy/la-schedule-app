[build]
  command = "npm run build"
  publish = ".next"

# The official Next.js runtime plugin — handles SSR/ISR on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled sync: pulls fresh FreeBusy data from Google every 10 minutes
# and writes a normalized snapshot into Netlify Blobs.
[functions."scheduled-sync"]
  schedule = "*/10 * * * *"

# Scheduled watch renewal: validates existing watch metadata and only
# registers a fresh Google Calendar watch when missing or expiring soon.
[functions."scheduled-google-watch-renew"]
  schedule = "17 4 * * *"

# Security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Service worker file must never be cached by the browser. Without this
# header, deploying a new sw.js (including a kill-switch rollback) can
# take up to 24 hours to propagate to installed clients.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/sw-kill.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
