[build]
  command = "npm run build"
  publish = ".next"

# The official Next.js runtime plugin — handles SSR/ISR on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled jobs live in netlify/functions/scheduled-*.ts and declare their own
# cron via `export const config = { schedule: ... }`.
#
# They must be Netlify Functions: a schedule cannot target an arbitrary HTTP
# path, so the top-level `[[crons]]` block that used to sit here (pointing at
# /api/cron/*) was not a recognized netlify.toml key and was silently ignored —
# no scheduled sync ran, and the snapshot only refreshed when someone saved a
# gig through the UI. The scheduled functions stay thin and call those same
# /api/cron/* routes over HTTP with ADMIN_TOKEN, so the 4KB Lambda env limit
# that motivated the original move is still avoided.

# Security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Service worker file must never be cached by the browser. Without this
# header, deploying a new sw.js (including a kill-switch rollback) can
# take up to 24 hours to propagate to installed clients.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/sw-kill.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Brand assets are stable, public, and never personalized. Long-lived
# immutable caching ensures the browser/CDN never re-fetches them after
# the first hit. To roll a new logo, change the filename so the cache
# key changes (or bump STATIC_CACHE_NAME in public/sw.js).
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
