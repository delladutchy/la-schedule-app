[build]
  command = "npm run build"
  publish = ".next"

# The official Next.js runtime plugin — handles SSR/ISR on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled jobs — run as Next.js API routes (not Lambda), so there is no
# 4KB AWS Lambda env var limit. The scheduler sends GET with the header
# x-netlify-event: scheduled; routes check this OR ADMIN_TOKEN bearer auth.
[[crons]]
  path     = "/api/cron/sync"
  schedule = "*/10 * * * *"

[[crons]]
  path     = "/api/cron/google-watch-renew"
  schedule = "17 4 * * *"

# Webhooks are the primary trigger; this cursor-based poll is a recovery path
# for delayed/missed provider events and is safe to run repeatedly.
[[crons]]
  path     = "/api/cron/bank-sync"
  schedule = "7,22,37,52 * * * *"

# Security headers on every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Service worker file must never be cached by the browser. Without this
# header, deploying a new sw.js (including a kill-switch rollback) can
# take up to 24 hours to propagate to installed clients.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/sw-kill.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Brand assets are stable, public, and never personalized. Long-lived
# immutable caching ensures the browser/CDN never re-fetches them after
# the first hit. To roll a new logo, change the filename so the cache
# key changes (or bump STATIC_CACHE_NAME in public/sw.js).
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
